[project]
name = "telegram-support-desk"
version = "0.1.0"
description = "A small Telegram support desk: customer messages become tickets for your team, replies go back to the customer. Standard library only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Dmytro Grechyshchev" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
